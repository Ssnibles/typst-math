[package]
name = "typst-math"
version = "0.1.0"
edition = "2021"
description = "Live Typst maths preview"

[lib]
name = "typst_math_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = true
strip = true
